<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#000000">
  <title>for you</title>
  <meta name="description" content="sound on ♪">
  <meta property="og:title" content="for you">
  <meta property="og:description" content="sound on ♪">
  <link rel="icon" href="heart.ico">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      height: 100dvh;
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      cursor: default;
    }
    canvas { display: block; }
    video {                       /* the edit plays here, out of sight: the canvas redraws it as letters */
      position: fixed;
      left: 0;
      top: 0;
      width: 2px;
      height: 2px;
      opacity: 0;
      pointer-events: none;
    }
    .oops, noscript p {
      position: fixed;
      inset: auto 0 24px 0;
      margin: 0;
      text-align: center;
      color: #c8a0b4;
      font: 14px Consolas, Menlo, monospace;
    }
  </style>
</head>
<body>
  <canvas id="screen" aria-label="a card that says: i grew some flowers for you. tap or press enter to open it."></canvas>
  <video id="song" src="feelings.mp4" playsinline webkit-playsinline preload="auto"></video>
  <noscript><p>this one needs javascript turned on ♥</p></noscript>
  <script src="data.js"></script>
  <script src="engine.js"></script>
  <script src="garden.js"></script>
  <script src="gift.js"></script>
</body>
</html>
